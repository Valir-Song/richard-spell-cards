<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{font:14px Arial,sans-serif;background:#faf5eb;color:#332c42;padding:14px;line-height:1.5}h3{margin:0 0 12px}</style><h3>Richard's Spell Cards 0.1</h3><p>При запуске создаётся карточка «Магическая рука».</p><p>Найди её на холсте и дважды нажми на название или описание для редактирования.</p><p>Если карточка не появилась, открой консоль разработчика (F12) и пришли текст ошибки.</p></html>
